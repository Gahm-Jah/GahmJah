<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gahm_Jah</title>
  <meta name="description" content="Gahm_Jah HTML tools home">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b4332'/%3E%3Cellipse cx='33' cy='34' rx='21' ry='16' fill='%23d89b46' transform='rotate(-13 33 34)'/%3E%3Ccircle cx='24' cy='30' r='2' fill='%236b3f1d'/%3E%3Ccircle cx='37' cy='39' r='2' fill='%236b3f1d'/%3E%3Cpath d='M20 47c8 5 22 5 31-3' fill='none' stroke='%23f5f0e6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #16231d;
      --muted: #667169;
      --paper: #fbfaf5;
      --line: #dce6d2;
      --leaf: #1f6f4a;
      --leaf-dark: #174d37;
      --gold: #d99a35;
      --sky: #dceff0;
      --rose: #f3dad0;
      --shadow: 0 24px 70px rgba(22, 35, 29, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(220, 239, 240, 0.72), transparent 34%),
        linear-gradient(315deg, rgba(243, 218, 208, 0.62), transparent 36%),
        var(--paper);
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1060px, calc(100% - 36px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .masthead {
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 18px;
      padding: 22px 0 30px;
    }

    .brand {
      margin: 0;
      font-size: clamp(2.9rem, 8vw, 6.8rem);
      line-height: 0.92;
      letter-spacing: 0;
      font-weight: 900;
    }

    .potato-wrap {
      width: min(360px, 76vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 48% 48%, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.34) 52%, transparent 70%),
        linear-gradient(135deg, rgba(31, 111, 74, 0.18), rgba(217, 154, 53, 0.16));
      box-shadow: var(--shadow);
    }

    .potato {
      width: 96%;
      height: 96%;
      object-fit: contain;
      filter: drop-shadow(0 22px 22px rgba(76, 54, 22, 0.22));
      transform: rotate(-3deg);
    }

    .home-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      margin-top: 10px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 50px rgba(22, 35, 29, 0.08);
      backdrop-filter: blur(14px);
    }

    .panel-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }

    .panel-title {
      margin: 0;
      font-size: clamp(1.3rem, 3vw, 2rem);
      line-height: 1.15;
    }

    .status {
      min-height: 1.4em;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .refresh {
      appearance: none;
      border: 1px solid rgba(31, 111, 74, 0.32);
      border-radius: 999px;
      background: var(--leaf);
      color: white;
      font: inherit;
      font-weight: 800;
      padding: 0.78rem 1rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(31, 111, 74, 0.22);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .refresh:hover {
      background: var(--leaf-dark);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(31, 111, 74, 0.25);
    }

    .refresh:focus-visible,
    .tool-link:focus-visible {
      outline: 3px solid rgba(217, 154, 53, 0.58);
      outline-offset: 3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      min-height: 92px;
    }

    .tool-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 72px;
      padding: 16px 18px;
      border: 1px solid rgba(22, 35, 29, 0.1);
      border-radius: 8px;
      background: #ffffff;
      text-decoration: none;
      font-weight: 850;
      box-shadow: 0 10px 24px rgba(22, 35, 29, 0.06);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .tool-link:hover {
      transform: translateY(-2px);
      border-color: rgba(31, 111, 74, 0.34);
      box-shadow: 0 16px 30px rgba(22, 35, 29, 0.1);
    }

    .tool-name {
      overflow-wrap: anywhere;
    }

    .tool-arrow {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(217, 154, 53, 0.16);
      color: #8b5713;
      font-size: 1.2rem;
      line-height: 1;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 92px;
      border: 1px dashed rgba(102, 113, 105, 0.42);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      padding: 18px;
      font-size: 1rem;
    }

    .note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      .shell {
        width: min(100% - 24px, 1060px);
        padding-top: 24px;
      }

      .masthead {
        gap: 12px;
        padding-bottom: 18px;
      }

      .home-panel {
        padding: 18px;
      }

      .panel-top {
        display: grid;
        align-items: start;
      }

      .refresh {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead" aria-label="Gahm_Jah home">
      <h1 class="brand">Gahm_Jah</h1>
      <div class="potato-wrap" aria-hidden="true">
        <img class="potato" src="assets/potato-cutout.png" alt="">
      </div>
    </header>

    <section class="home-panel" aria-labelledby="page-list-title">
      <div class="panel-top">
        <div>
          <h2 class="panel-title" id="page-list-title">목차</h2>
          <p class="status" id="status">HTML 파일을 찾는 중입니다.</p>
        </div>
        <button class="refresh" type="button" id="refreshButton">새로고침</button>
      </div>

      <nav class="grid" id="pageGrid" aria-label="HTML page list"></nav>
      <p class="note">같은 폴더에 새 HTML 파일을 올리면 GitHub Pages에서 이 목록에 자동으로 표시됩니다.</p>
    </section>
  </main>

  <script>
    const manualLinks = [
      // GitHub API를 사용할 수 없는 환경에서 항상 보여줄 항목이 있다면 아래처럼 추가하세요.
      // { title: "통계학", href: "statistics.html" },
    ];

    const pageGrid = document.querySelector("#pageGrid");
    const statusText = document.querySelector("#status");
    const refreshButton = document.querySelector("#refreshButton");

    function prettifyName(fileName) {
      return decodeURIComponent(fileName)
        .replace(/\.html?$/i, "")
        .replace(/[-_]+/g, " ")
        .trim() || fileName;
    }

    function renderLinks(items, message) {
      pageGrid.innerHTML = "";
      statusText.textContent = message;

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 연결할 HTML 파일이 없습니다.";
        pageGrid.append(empty);
        return;
      }

      for (const item of items) {
        const link = document.createElement("a");
        link.className = "tool-link";
        link.href = item.href;
        link.innerHTML = `<span class="tool-name"></span><span class="tool-arrow" aria-hidden="true">›</span>`;
        link.querySelector(".tool-name").textContent = item.title;
        pageGrid.append(link);
      }
    }

    function getGitHubTarget() {
      const host = window.location.hostname;
      if (!host.endsWith(".github.io")) return null;

      const owner = host.replace(".github.io", "");
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const isUserSite = pathParts.length === 0;
      const repo = isUserSite ? `${owner}.github.io` : pathParts[0];
      const directoryParts = isUserSite ? [] : pathParts.slice(1);
      const directory = directoryParts.map(encodeURIComponent).join("/");

      return { owner, repo, directory };
    }

    async function loadPages() {
      const target = getGitHubTarget();
      const localItems = manualLinks.map((item) => ({
        title: item.title || prettifyName(item.href),
        href: item.href,
      }));

      if (!target) {
        renderLinks(localItems, "GitHub Pages에서 열면 HTML 목록이 자동으로 표시됩니다.");
        return;
      }

      const apiPath = target.directory ? `/${target.directory}` : "";
      const apiUrl = `https://api.github.com/repos/${target.owner}/${target.repo}/contents${apiPath}`;

      try {
        statusText.textContent = "HTML 파일을 찾는 중입니다.";
        const response = await fetch(apiUrl, {
          headers: { "Accept": "application/vnd.github+json" },
        });
        if (!response.ok) throw new Error(`GitHub API ${response.status}`);

        const files = await response.json();
        const htmlItems = files
          .filter((file) => file.type === "file" && /\.html?$/i.test(file.name) && !/^index\.html?$/i.test(file.name))
          .sort((a, b) => a.name.localeCompare(b.name, "ko"))
          .map((file) => ({
            title: prettifyName(file.name),
            href: file.name,
          }));

        const merged = [...localItems, ...htmlItems].filter((item, index, arr) =>
          arr.findIndex((candidate) => candidate.href === item.href) === index
        );

        renderLinks(merged, merged.length ? `${merged.length}개의 HTML 파일` : "연결할 HTML 파일을 기다리는 중입니다.");
      } catch (error) {
        renderLinks(localItems, "자동 목록을 불러오지 못했습니다.");
      }
    }

    refreshButton.addEventListener("click", loadPages);
    loadPages();
  </script>
</body>
</html>
